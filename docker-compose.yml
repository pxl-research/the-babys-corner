services:
  backend:
    build: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: true
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    # Both mappings reach the same container, on purpose: 3000 is the port the VM
    # serves on, 8019 the one used for local deployment. The prod overlay resets
    # these and routes everything through Caddy on 80/443 instead.
    ports:
      - "3000:80"
      - "8019:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
