services:
  backend:
    build: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: true
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
      - "8019:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
