services:
  backend:
    build: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
